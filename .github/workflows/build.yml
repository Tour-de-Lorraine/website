name: Build and Package Static Site

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package build as zip
        run: |
          cd build
          zip -r ../static-site.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: static-site.zip
          retention-days: 30
