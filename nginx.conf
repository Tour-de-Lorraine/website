server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy Directus API endpoints to eliminate CORS
    location /graphql {
        proxy_pass https://next.tourdelorraine.ch/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host next.tourdelorraine.ch;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://www.tourdelorraine.ch";
        proxy_set_header Referer "https://www.tourdelorraine.ch/";
        proxy_ssl_server_name on;
        proxy_ssl_name next.tourdelorraine.ch;
    }

    location /items {
        proxy_pass https://next.tourdelorraine.ch/items;
        proxy_http_version 1.1;
        proxy_set_header Host next.tourdelorraine.ch;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://www.tourdelorraine.ch";
        proxy_set_header Referer "https://www.tourdelorraine.ch/";
        proxy_ssl_server_name on;
        proxy_ssl_name next.tourdelorraine.ch;
    }

    location /files {
        proxy_pass https://next.tourdelorraine.ch/files;
        proxy_http_version 1.1;
        proxy_set_header Host next.tourdelorraine.ch;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://www.tourdelorraine.ch";
        proxy_set_header Referer "https://www.tourdelorraine.ch/";
        proxy_ssl_server_name on;
        proxy_ssl_name next.tourdelorraine.ch;
    }

    # For /assets: try local files first, then proxy to Directus
    location /assets {
        root /usr/share/nginx/html;
        try_files $uri @directus_assets;
    }

    location @directus_assets {
        proxy_pass https://next.tourdelorraine.ch;
        proxy_http_version 1.1;
        proxy_set_header Host next.tourdelorraine.ch;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://www.tourdelorraine.ch";
        proxy_set_header Referer "https://www.tourdelorraine.ch/";
        proxy_ssl_server_name on;
        proxy_ssl_name next.tourdelorraine.ch;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Main location - SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
